<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a Broadside game</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0b1a2b; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    main { padding: 32px; max-width: 420px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .code { font-family: ui-monospace, monospace; font-size: 40px; letter-spacing: 6px; margin: 16px 0; }
    a.btn { display: inline-block; margin-top: 12px; padding: 14px 24px; background: #5ab3ff; color: #06213a; border-radius: 12px; text-decoration: none; font-weight: 700; }
    p { color: #b7c9db; }
  </style>
</head>
<body>
  <main>
    <h1>You've been challenged!</h1>
    <p>Open Broadside on your iPhone and enter this join code:</p>
    <div class="code" id="code">------</div>
    <a class="btn" id="open" href="#">Open in Broadside</a>
    <p>Don't have the app yet? Ask your friend for the TestFlight invite.</p>
  </main>
  <script>
    // URL is /join/CODE. Show the code and try to open the app via its custom scheme
    // (universal links handle this automatically once the app is installed and the domain is associated).
    var code = (location.pathname.split('/').pop() || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    document.getElementById('code').textContent = code || '------';
    var deep = 'broadside://join/' + code;
    document.getElementById('open').href = deep;
    if (code) setTimeout(function () { location.href = deep; }, 400);
  </script>
</body>
</html>
