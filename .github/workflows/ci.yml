name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web app (tests, types, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build

  functions:
    name: Cloud Functions (tests, types, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm run test:coverage
      - working-directory: functions
        run: npm run sim
      - working-directory: functions
        run: npm run typecheck
      - working-directory: functions
        run: npm run lint
      - working-directory: functions
        run: npm run build

  visual-qa:
    name: Browser visual QA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci
      - run: npm --prefix web ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - run: npm --prefix functions run build
      - run: npm --prefix functions exec -- firebase emulators:exec --only auth,firestore,functions --project demo-broadside "npm --prefix web run visual-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-screenshots
          path: web/e2e/baselines/*.png
          if-no-files-found: warn
