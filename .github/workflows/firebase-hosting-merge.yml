name: Deploy to Firebase Hosting on merge to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explain missing service account
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::warning::Nothing was deployed because the repository secret" \
            "FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV is not set." \
            "See docs/TESTING_PREVIEWS.md for the one-time setup steps."

      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # See firebase-hosting-pull-request.yml – the VITE_* variables are optional on Firebase Hosting.
      - name: Build web app
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'broadside-dev' }}
          channelId: live
          entryPoint: .
