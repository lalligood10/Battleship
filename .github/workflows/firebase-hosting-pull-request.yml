name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV }}

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explain missing service account
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::warning::No preview was deployed because the repository secret" \
            "FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV is not set." \
            "See docs/TESTING_PREVIEWS.md for the one-time setup steps."

      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Firebase web config is optional here: when the site is served by Firebase Hosting the app
      # reads it from /__/firebase/init.json automatically. Repository *variables* (Settings → Secrets
      # and variables → Actions → Variables) can override it if you ever need to.
      - name: Build web app
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROADSIDE_DEV }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'broadside-dev' }}
          entryPoint: .
